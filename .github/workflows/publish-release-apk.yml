name: Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
            mkdir -p "${KEYSTORE_DIR}"
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_DIR}/release.jks"
            echo "KEYSTORE_FILE=${KEYSTORE_DIR}/release.jks" >> $GITHUB_ENV
          else
            echo "No release keystore secret found, proceeding with fallback"
          fi

      - name: Extract Tag Version and Assemble Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${RAW_TAG#v}"
          echo "Building release for version: ${VERSION_NAME}"
          ./gradlew assembleRelease -PappVersionName="${VERSION_NAME}"

      - name: Package Release APK and Generate SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/release
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${RAW_TAG#v}"
          RELEASE_APK="box-mobile_v${VERSION_NAME}.apk"
          cp app-release.apk "${RELEASE_APK}"
          sha256sum "${RELEASE_APK}" > "${RELEASE_APK}.sha256"
          echo "release_apk=${RELEASE_APK}" >> $GITHUB_ENV
          echo "release_sha256=${RELEASE_APK}.sha256" >> $GITHUB_ENV

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/${{ env.release_apk }}
            app/build/outputs/apk/release/${{ env.release_sha256 }}
          generate_release_notes: true
